# MangoHud.conf - gaming host
#
# Single-layer config: no presets. Shift_R+F12 hides/shows the HUD.
# Logging: Shift_L+F2 to start, Shift_L+F2 again to stop and write the CSV.

# ── lock to this file (no preset cycling) ────────────────────────────────────
preset=-1

# ── what to show ─────────────────────────────────────────────────────────────
fps

# Tuning stats — uncomment when checking CPU vs GPU bound:
# fps_metrics=avg,0.01,0.001
# frametime
# frame_timing=1
# cpu_stats
# core_bars
# gpu_stats
# gpu_core_clock
# vram
# ram

# ── size and placement ───────────────────────────────────────────────────────
position=top-left
font_size=10
background_alpha=0.3
round_corners=6

# ── keybinds ─────────────────────────────────────────────────────────────────
toggle_hud=Shift_R+F12
toggle_logging=Shift_L+F2
reload_cfg=Shift_L+F4

# ── logging ──────────────────────────────────────────────────────────────────
# output_folder takes a literal path, no ~ or $HOME expansion.
output_folder=/home/bane/mangohud-logs
log_duration=0
log_interval=100
# autostart_log=5
