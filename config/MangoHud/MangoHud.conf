# MangoHud.conf - gaming host
#
# This is the BASE layer: position, size, binds, and a bare fps readout.
# Everything heavier lives in presets.conf and is cycled in-game with
# Shift_R+F10 (0 off -> 1 fps -> 2 competitive -> 3 tuning -> 4 everything).
# A preset fully overrides this file while it's active.

# ── what to show by default ──────────────────────────────────────────────────
fps

# ── size and placement ───────────────────────────────────────────────────────
position=top-left
font_size=10
background_alpha=0.3
round_corners=6

# ── keybinds ─────────────────────────────────────────────────────────────────
toggle_hud=Shift_R+F12
toggle_preset=Shift_R+F10
toggle_logging=Shift_L+F2
reload_cfg=Shift_L+F4

# ── logging ──────────────────────────────────────────────────────────────────
# Off by default — Shift_L+F2 starts and stops a run by hand, which is what you
# want when you're comparing two configs rather than collecting every session.
# Uncomment autostart_log to capture every launch instead.
#
# NOTE: output_folder takes a literal path, no ~ or $HOME expansion, so this
# line is gaming-host-specific. Fix the username before stowing on another box.
output_folder=/home/bane/mangohud-logs
log_duration=0
log_interval=100
# autostart_log=5
