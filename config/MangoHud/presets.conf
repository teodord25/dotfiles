# presets.conf — cycled in-game with Shift_R+F10
# stowed to ~/.config/MangoHud/presets.conf
#
# 0 off  ->  1 fps only  ->  2 competitive  ->  3 tuning  ->  4 everything
#
# Overrides MangoHud.conf while active. Start in 3 while you're still changing
# things; live in 1 or 2 afterwards.

[preset 0]
no_display=1

# ── 1: fps only. What you actually want during a match. ──────────────────────
[preset 1]
fps
position=top-left
font_size=18
background_alpha=0.2
round_corners=6

# ── 2: competitive. fps + lows + frametime graph, nothing that costs frames. ─
[preset 2]
fps
fps_metrics=avg,0.01
frametime
frame_timing=1
position=top-left
font_size=18
background_alpha=0.3
round_corners=6

# ── 3: tuning. Is scx / gamemode / core pinning doing anything? ──────────────
[preset 3]
fps
fps_metrics=avg,0.01,0.001
frametime
frame_timing=1
histogram
cpu_stats
cpu_temp
cpu_mhz
cpu_load_change
core_bars
core_load_change
gpu_stats
gpu_temp
gpu_core_clock
gpu_power
gpu_load_change
vram
ram
gamemode
throttling_status
position=top-left
font_size=20
background_alpha=0.4
round_corners=6
table_columns=3

# ── 4: everything, including the "am I on the native Vulkan path" checks ─────
[preset 4]
full
engine_version
vulkan_driver
gpu_name
wine
gamemode
throttling_status
core_bars
fps_metrics=avg,0.01,0.001
position=top-left
font_size=20
background_alpha=0.4
round_corners=6
table_columns=3
