# ── Gaming PC (AMD CPU + AMD GPU) ────────────────────────────────────────────

# Fill in the real output/mode once known (`hyprctl monitors`), e.g.:
# monitor=DP-1,1920x1080@240,0x0,1
monitor=,highrr,auto,1

# VRR in fullscreen only — smooth in games, no desktop cursor jank
misc {
    vrr = 2
}

# let all games bypass the compositor frame queue (lower latency,
# tearing allowed because general:allow_tearing is on)
windowrule = immediate on, match:class ^(steam_app_.*)$

# jump to the running game
bind = $mod, G, exec, hyprctl dispatch focuswindow class:^(steam_app_.*)$

# HDR on/off (SUPER+U). Edit the mode lines at the top of hdr.sh to match
# the monitor. For in-game HDR use Steam launch options:
#   gamescope --hdr-enabled -f -- %command%
bind = $mod, U, exec, $scripts/sh/hdr.sh toggle
