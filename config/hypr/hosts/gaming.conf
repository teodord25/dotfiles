# ── Gaming PC (AMD CPU + AMD GPU) ────────────────────────────────────────────

# Floor: whatever display.sh doesn't set still comes up usable. The named modes
# below override this; this only matters if exec-once fails or an output the
# script doesn't manage gets plugged in.
monitor=,preferred,auto,1

# Pin the output display.sh drives. Autodetect matches on model (XG32UCWMG),
# but setting this explicitly removes the guesswork — check `hyprctl monitors`.
# env = DISPLAY_MONITOR,DP-1

# VRR is set per-monitor in the display.sh mode tails (comp/cinema use 2,
# desktop uses 0), so there's no global misc:vrr here — two sources of truth
# for the same setting is how the old hdr.sh drifted out of sync.

# let all games bypass the compositor frame queue (lower latency,
# tearing allowed because general:allow_tearing is on)
windowrule = immediate on, match:class ^(steam_app_.*)$
# except this one — FIXME: name the game, 1903340 is unreadable in six months
windowrule = immediate off, match:class ^(steam_app_1903340)$

# jump to the running game
bind = $mod, G, exec, hyprctl dispatch focuswindow class:^(steam_app_.*)$

# For in-game HDR use Steam launch options:
#   gamescope --hdr-enabled -f -- %command%

# gaming    — 1080p @ 480Hz, SDR
bind = $mod, F1, exec, $scripts/sh/display.sh comp

# 4K SDR    — 3840x2160 @ 240Hz, sRGB
bind = $mod, F2, exec, $scripts/sh/display.sh desktop

# 4K HDR    — 3840x2160 @ 240Hz, HDR
bind = $mod, F3, exec, $scripts/sh/display.sh cinema

# Log in at 4K, not 1080p — $mod+F1 is one keypress when you sit down to play.
exec-once = $scripts/sh/display.sh desktop
