# ── Work laptop (Dell Precision, Intel + Nvidia PRIME, hidpi) ────────────────

monitor=DP-3,3840x2160@60,0x0,1.5
monitor=DP-2,3840x2160@60,2560x0,1.5
monitor=eDP-1,3840x2400@60,5120x0,2

# monitor=DP-3,3840x2160@120,0x0,1.5
# monitor=DP-2,3840x2160@60,2560x0,1
# monitor=eDP-1,disable

# monitor=DP-3,1920x1080@240,0x0,1
# monitor=DP-2,disable
# monitor=eDP-1,disable

workspace=1,monitor:DP-3
workspace=2,monitor:DP-3
workspace=3,monitor:DP-3
workspace=7,monitor:DP-3
workspace=8,monitor:eDP-1
workspace=9,monitor:DP-2
workspace=10,monitor:DP-2

windowrule {
    name = work-ff
    match:class = ^(firefox)$
    workspace = 9
}

windowrule {
    name = all-zen
    match:class = ^(zen)$
    workspace = 8
}

# hidpi scaling for X/GTK/Qt apps
env = GDK_SCALE,2
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_SCALE_FACTOR,1.5

# laptop brightness keys
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# don't auto-connect warp on boot
exec-once = warp-cli disconnect
