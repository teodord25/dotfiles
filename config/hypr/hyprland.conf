# ── Common Hyprland config ────────────────────────────────────────────────────
# Host-specific things (monitors, workspace pinning, scaling, gaming/HDR
# binds) live in hosts/{work,gaming}.conf. scripts/sh/setup/config.sh
# symlinks the right one to ~/.config/hypr/host.conf, which is sourced at
# the bottom of this file so it can override anything here.

$mod = SUPER
$scripts = $HOME/dotfiles/scripts

misc {
	disable_splash_rendering = true
	disable_hyprland_logo = true
	vrr = 0 # gaming host overrides this
	focus_on_activate = true
}

general {
	layout = dwindle
	col.active_border = rgba(000000ff)
	# col.inactive_border = rgba(000000ff)
	allow_tearing = true # only tears for windows with `immediate` set
}

render {
    direct_scanout = true
    non_shader_cm = 3
    # non_shader_cm_interop = 1
}

decoration {
	rounding = 8
}

cursor {
    no_hardware_cursors = false
    use_cpu_buffer = true
}

input {
	kb_layout = us
	kb_model = pc105

	accel_profile = flat
	sensitivity = 0

	follow_mouse = 1
	mouse_refocus = false
}

xwayland {
    force_zero_scaling = true
}

env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,24
env = ANKI_WAYLAND,1

windowrule {
    name = tridactyl-editor
    match:title = ^(tridactyl-editor)$
    float = on
    size = 60% 60%
    center = on
}

# ── Autostart ─────────────────────────────────────────────────────────────────
# NOTE: wlsunset is a systemd user service (nixos/modules/profiles/desktop.nix)
# — don't also exec-once it here.
exec-once = swww-daemon
exec-once = sleep 0.5 && swww img ~/dotfiles/wallpapers/gods-in-his-heaven-oled.png
exec-once = ironbar
exec-once = kwalletd6

# ── Binds ─────────────────────────────────────────────────────────────────────
# bind[flags]:
# l -> locked, also works when an input inhibitor (e.g. a lockscreen) is active
# r -> release   e -> repeat   n -> non-consuming   m -> mouse
# t -> transparent   i -> ignore mods   s -> separate   d -> description
# p -> bypasses the app's requests to inhibit keybinds

# red-tint screen shader
bind = $mod, M, exec, hyprctl keyword decoration:screen_shader ~/.config/hypr/shaders/red.glsl; hyprctl keyword cursor:no_hardware_cursors true
bind = $mod, N, exec, hyprctl keyword decoration:screen_shader ~/.config/hypr/shaders/dim.glsl; hyprctl keyword cursor:no_hardware_cursors true
bind = $mod SHIFT, M, exec, hyprctl keyword decoration:screen_shader ""; hyprctl keyword cursor:no_hardware_cursors false

# TODO: add <C-o> to go back to previous workspace if possible
bind = $mod            , T      , exec           , ghostty
bind = $mod            , D      , exec           , pkill -x rofi || rofi -show drun
bind = $mod            , F      , exec           , firefox
bind = $mod            , Tab    , exec           , pkill -x rofi || rofi -show window
bind = $mod+Shift      , E      , exec           , pkill -x rofi || rofi -show filebrowser
bind = $mod            , P      , exec           , $scripts/sh/screenshot.sh p # partial
bind = $mod+Ctrl       , P      , exec           , $scripts/sh/screenshot.sh m # monitor
bind = Ctrl+Shift      , Escape , exec           , btm
bind = $mod+Ctrl       , h      , movefocus      , l
bind = $mod+Ctrl       , j      , movefocus      , d
bind = $mod+Ctrl       , k      , movefocus      , u
bind = $mod+Ctrl       , l      , movefocus      , r
bind = $mod+Ctrl+Shift , h      , movewindow     , l
bind = $mod+Ctrl+Shift , j      , movewindow     , d
bind = $mod+Ctrl+Shift , k      , movewindow     , u
bind = $mod+Ctrl+Shift , l      , movewindow     , r
bind = $mod            , S      , togglefloating
bind = $mod            , Q      , killactive
bind = Alt             , Return , fullscreen
bind = Ctrl            , 1      , exec           , sh -c 'echo \"Teodor Đurić\" | wl-copy'
bind = Ctrl            , 2      , exec           , sh -c 'echo \"djuric.teodor25@gmail.com\" | wl-copy'

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
bindm = $mod, Z, movewindow
bindm = $mod, X, resizewindow

# media / volume (pipewire)
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+

binde = $mod+Alt, h, resizeactive, -30 0
binde = $mod+Alt, j, resizeactive, 0 30
binde = $mod+Alt, k, resizeactive, 0 -30
binde = $mod+Alt, l, resizeactive, 30 0

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, n, workspace, 7
bind = $mod, h, workspace, 8
bind = $mod, k, workspace, 9
bind = $mod, j, workspace, 10

bind = $mod+Shift, 1, movetoworkspace, 1
bind = $mod+Shift, 2, movetoworkspace, 2
bind = $mod+Shift, 3, movetoworkspace, 3
bind = $mod+Shift, 4, movetoworkspace, 4
bind = $mod+Shift, 5, movetoworkspace, 5
bind = $mod+Shift, 6, movetoworkspace, 6
bind = $mod+Shift, n, movetoworkspace, 7
bind = $mod+Shift, h, movetoworkspace, 8
bind = $mod+Shift, k, movetoworkspace, 9
bind = $mod+Shift, j, movetoworkspace, 10

bind = $mod+Alt, 1, movetoworkspacesilent, 1
bind = $mod+Alt, 2, movetoworkspacesilent, 2
bind = $mod+Alt, 3, movetoworkspacesilent, 3
bind = $mod+Alt, 4, movetoworkspacesilent, 4
bind = $mod+Alt, 5, movetoworkspacesilent, 5
bind = $mod+Alt, 6, movetoworkspacesilent, 6
bind = $mod+Alt, n, movetoworkspacesilent, 7
bind = $mod+Alt, h, movetoworkspacesilent, 8
bind = $mod+Alt, k, movetoworkspacesilent, 9
bind = $mod+Alt, j, movetoworkspacesilent, 10

# ── Host-specific config (must stay last so it can override) ──────────────────
source = ~/.config/hypr/host.conf
